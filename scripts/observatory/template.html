<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Network — Observatory</title>
<style>
  /* Fonts embedded as base64 so the page is fully self-contained (no network calls). */
/*__OBS_FONTS__*/
/*__OBS_TOKENS__*/
  html,body{margin:0;height:100%;background:var(--obs-sky-2);overflow:hidden;}
  *{box-sizing:border-box;}
  ::selection{background:rgba(138,180,255,0.3);}
  input:focus,textarea:focus{outline:none;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  @keyframes obsFadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes obsSlide{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
  @keyframes obsRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes obsPop{from{opacity:0;transform:scale(.965) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .obs-root{position:fixed; inset:0; overflow:hidden; background:radial-gradient(130% 120% at 50% -12%, var(--obs-sky-0) 0%, var(--obs-sky-1) 46%, var(--obs-sky-2) 100%); color:var(--obs-ink); font-family:var(--obs-font-body); -webkit-font-smoothing:antialiased;}
  /* Real-data hardening: long company / title strings must never overflow a panel. */
  .obs-wrap-any{overflow-wrap:anywhere; word-break:break-word;}
  /* Narrow screens: shrink the header so it can't collide with the centered search. */
  @media (max-width:1120px){
    .obs-title{font-size:22px !important;}
    .obs-search{width:min(460px,50vw) !important;}
  }
  @media (max-width:900px){
    .obs-search{width:min(400px,46vw) !important;}
    .obs-stats{display:none !important;}  /* collides with the centered search */
  }
</style>
</head>
<body>
<div class="obs-root">
<!--__OBS_NAV__-->

  <canvas id="obs-canvas" style="position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab;"></canvas>
  <div style="position:absolute; top:0; left:0; right:0; height:220px; z-index:8; pointer-events:none; background:linear-gradient(to bottom, rgba(4,5,11,0.97) 0%, rgba(5,7,16,0.9) 38%, rgba(6,8,18,0.55) 72%, rgba(6,8,18,0) 100%);"></div>
  <div style="position:absolute; bottom:0; left:0; right:0; height:160px; z-index:8; pointer-events:none; background:linear-gradient(to top, rgba(4,5,11,0.94) 0%, rgba(5,7,16,0.62) 52%, rgba(6,8,18,0) 100%);"></div>

  <div id="obs-tip" style="position:absolute; left:0; top:0; transform:translate(-9999px,-9999px); pointer-events:none; z-index:40; background:rgba(9,12,22,0.94); border:1px solid rgba(255,255,255,0.14); border-radius:11px; padding:9px 12px; backdrop-filter:blur(10px); box-shadow:0 10px 34px rgba(0,0,0,0.55); white-space:nowrap;"></div>

  <!-- Header -->
  <div style="position:absolute; top:var(--obs-nav-h); left:0; right:0; display:flex; align-items:flex-start; justify-content:space-between; padding:16px 26px 22px; z-index:20; pointer-events:none;">
    <div style="pointer-events:auto;">
      <div style="display:flex; align-items:center; gap:9px;">
        <div style="width:9px;height:9px;border-radius:50%;background:var(--obs-star);box-shadow:0 0 13px 2px rgba(245,199,126,0.75);"></div>
        <div style="font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:0.24em; color:#aeb6d0;">OBSERVATORY</div>
      </div>
      <div class="obs-title" style="font-family:'Instrument Serif',serif; font-size:25px; line-height:1.0; margin-top:6px; color:#eef1f8; letter-spacing:0.01em;">Your network</div>
      <div style="font-family:'Instrument Serif',serif; font-style:italic; font-size:14px; line-height:1.1; margin-top:2px; color:#aeb6d0;">for the first time</div>
      <button data-act="openReading" style="margin-top:10px; display:inline-flex; align-items:center; gap:7px; background:rgba(245,199,126,0.1); border:1px solid rgba(245,199,126,0.32); color:#f2d29a; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.08em; padding:6px 11px; border-radius:9px; cursor:pointer;">✦ READ MY NETWORK</button>
      <button id="obs-sync-btn" data-act="openSync" style="display:none; margin-top:10px; margin-left:8px; align-items:center; gap:7px; background:rgba(138,180,255,0.12); border:1px solid rgba(138,180,255,0.4); color:#cddaff; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.08em; padding:6px 11px; border-radius:9px; cursor:pointer;"></button>
    </div>
    <div class="obs-stats" style="pointer-events:auto; text-align:right; font-family:var(--obs-font-mono); font-size:12px; color:var(--obs-ink-faint); line-height:1.75;">
      <div><span id="stat-people" style="color:#e9ecf5;"></span> connections</div>
      <div><span id="stat-companies" style="color:#e9ecf5;"></span> companies · <span id="stat-span"></span></div>
    </div>
  </div>

  <!-- Search (top-center). Input is persistent so focus survives re-renders. -->
  <div class="obs-search" style="position:absolute; top:calc(var(--obs-nav-h) + 12px); left:50%; transform:translateX(-50%); width:min(520px,50vw); z-index:30; display:flex; flex-direction:column; align-items:center; gap:9px; animation:obsFadeIn .6s ease both;">
    <div style="width:100%; display:flex; align-items:center; gap:11px; background:rgba(11,15,28,0.96); border:1px solid rgba(255,255,255,0.14); border-radius:13px; padding:11px 15px; box-shadow:0 12px 44px rgba(0,0,0,0.5);">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex:none;"><circle cx="7" cy="7" r="5.2" stroke="#79839f" stroke-width="1.5"/><line x1="11" y1="11" x2="14.5" y2="14.5" stroke="#79839f" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input id="obs-search-input" data-act="search" placeholder="Search a name, company, or title" style="flex:1; background:transparent; border:none; color:#eef1f8; font-size:15px; font-family:inherit;"/>
      <button data-act="clearFilter" id="obs-clear" style="display:none; flex:none; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); color:#aab2cc; font-family:'IBM Plex Mono',monospace; font-size:11px; padding:4px 9px; border-radius:7px; cursor:pointer;">CLEAR</button>
    </div>
    <div id="r-answer"></div>
  </div>

  <!-- Legend (left) shown when not filtering; render() fills it and toggles display -->
  <div id="r-legend" style="display:none; position:absolute; left:24px; top:calc(var(--obs-nav-h) + 134px); bottom:190px; width:250px; z-index:20; background:rgba(9,12,22,0.72); border:1px solid rgba(255,255,255,0.09); border-radius:12px; padding:12px 14px; backdrop-filter:blur(10px); flex-direction:column; animation:obsFadeIn .6s ease both;"></div>

  <!-- Match list (left) shown when filtering -->
  <div id="r-list" style="display:none; position:absolute; left:24px; top:calc(var(--obs-nav-h) + 170px); width:262px; bottom:190px; z-index:22; background:rgba(9,12,22,0.88); border:1px solid rgba(138,180,255,0.22); border-radius:13px; backdrop-filter:blur(13px); box-shadow:0 14px 44px rgba(0,0,0,0.5); flex-direction:column; overflow:hidden; animation:obsFadeIn .4s ease both;"></div>

  <!-- Bottom controls: caption + VIEW + COLOR -->
  <div style="position:absolute; bottom:18px; left:50%; transform:translateX(-50%); z-index:25; display:flex; flex-direction:column; align-items:center; gap:9px; background:rgba(12,16,30,0.86); border:1px solid rgba(255,255,255,0.1); border-radius:16px; padding:11px 15px 10px; backdrop-filter:blur(14px); box-shadow:0 12px 44px rgba(0,0,0,0.55); animation:obsFadeIn .6s ease both; max-width:min(760px,88vw);">
    <div id="r-viewcap" style="font-size:12.5px; line-height:1.35; color:rgba(208,215,238,0.88); text-align:center;"></div>
    <div style="display:flex; gap:13px; align-items:center; flex-wrap:wrap; justify-content:center;">
      <div style="display:flex; align-items:center; gap:6px;">
        <span style="font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; color:#7f88a6; padding:0 3px;">VIEW</span>
        <span id="r-layout" style="display:contents;"></span>
      </div>
      <div style="display:flex; align-items:center; gap:6px;">
        <span style="font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; color:#7f88a6; padding:0 3px;">COLOR</span>
        <span id="r-dim" style="display:contents;"></span>
      </div>
    </div>
  </div>

  <!-- Detail panel (right) -->
  <div id="r-panel" style="display:none;"></div>

  <!-- Reading modal -->
  <div id="r-reading" style="display:none;"></div>

  <!-- Sync-to-agent modal -->
  <div id="r-sync" style="display:none;"></div>

</div>

<script>
window.OBS_DATA = __OBSERVATORY_DATA__;
</script>
<script>
"use strict";
(function(){
/* ================================================================
   Observatory — standalone port of the Claude Design "Network memory
   visual explorer". The canvas engine is reproduced from the design;
   the fake-data generator is replaced by real imported data, and the
   design-framework reactive layer is replaced by a small vanilla one.
   ================================================================ */

var DATA = window.OBS_DATA || {people:[], stats:{}, insights:{}, config:{}};
var CFG = DATA.config || {};

function App(){
  this.state = { layout: CFG.defaultLayout||'field', dim: CFG.defaultDimension||'company',
                 selectedId:null, query:'', facets:{}, special:null, openFacet:null, showReading:true, showLinks:true };
  this.people = [];
  this.legendArr = [];
  this.answerText = '';
  this.hasFilter = false;
  this.matchList = [];
  this.matchOverflow = '';
  this.matchTotal = 0;
  this.facetOptions = { company:[], role:[], sen:[], era:[] };
  this.notes = {};
  this.recon = {};
  this.byKey = {};
  this.companyCount = {};
  this.labels = [];
  this.ringRadii = [];
  this.showYou = false;
  this.cam = { x:0, y:0, scale:1, tx:0, ty:0, tscale:1 };
  this.fitScale = 1;
  this.hoverId = null;
  this._lastPanelId = undefined;
}
App.prototype = {
  PALETTE:['#f2c14e','#f4924f','#f26d6d','#e85f9c','#c168e0','#8f7bff','#5f8dff','#3fa7ff','#33c4cf','#3ad39c','#7fd257','#d4d24a'],
  OTHER:'#565f7a',
  ERA_KEYS:['e1','e2','e3','e4','e5'],
  ERA_LABELS:{ e1:'The early days ·’09–’13', e2:'’14–’16', e3:'’17–’19', e4:'’20–’22', e5:'’23–’26' },
  MONTHS:['January','February','March','April','May','June','July','August','September','October','November','December'],
  SEN_CLAUSE:{ founder:'now founders', exec:'now C-level', vp:'now VPs', dir:'now Director-level or above', mgr:'now managers or above', ic:'individual contributors' },
  ERA_PHRASE:{ early:'from your early days', e3:'connected ’17–’19', e4:'connected ’20–’22', e5:'connected recently' },

  fmt:function(n){ try{ return Number(n).toLocaleString('en-US'); }catch(e){ return ''+n; } },
  hx:function(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; },
  lerpHex:function(a,b,t){ var A=this.hx(a),B=this.hx(b); var f=function(i){return Math.round(A[i]+(B[i]-A[i])*t).toString(16).padStart(2,'0');}; return '#'+f(0)+f(1)+f(2); },
  hexA:function(h,al){ var A=this.hx(h); return 'rgba('+A[0]+','+A[1]+','+A[2]+','+al+')'; },
  senColor:function(r){ return this.lerpHex('#4a78d0','#f5b84a',(r-1)/7); },
  eraColor:function(k){ var i=this.ERA_KEYS.indexOf(k); return this.lerpHex('#f0a24e','#5fb3ea', i/(this.ERA_KEYS.length-1)); },
  senLabel:function(p){ if(p.isFounder) return 'Founder'; return ({1:'Entry',2:'Individual contributor',3:'Senior IC',4:'Staff / Lead',5:'Manager',6:'Director',7:'VP',8:'Executive'})[p.rank]||''; },
  shortLabel:function(s){ return s.length>17? s.slice(0,16)+'…':s; },
  clip:function(s,n){ s=s||''; return s.length>n? s.slice(0,n-1)+'…':s; },

  // ---------------- data (real, from the export) ----------------
  build:function(){
    var self=this;
    var raw = DATA.people || [];
    var people=[]; var id=0;
    raw.forEach(function(d){
      var year = d.year||null, month=d.month||null;
      var era='e5', eraIdx=4;
      if(year==null){ era='e5'; eraIdx=4; }
      else if(year<=2013){era='e1';eraIdx=0;} else if(year<=2016){era='e2';eraIdx=1;}
      else if(year<=2019){era='e3';eraIdx=2;} else if(year<=2022){era='e4';eraIdx=3;}
      var company = (d.company&&d.company.trim())? d.company.trim() : 'Independent / unknown';
      var title = (d.title&&d.title.trim())? d.title.trim() : '—';
      var yr = year||2026;
      // Stable identity key so flags/notes survive regeneration (not the row index).
      var key = (d.url&&d.url.trim()) ? ('u:'+d.url.trim().toLowerCase().replace(/\/+$/,''))
                                      : ('n:'+(d.name||'').toLowerCase()+'|'+company.toLowerCase());
      var p = {
        id:id++, pkey:key, dbid:(d.id!=null?d.id:null), priority:d.priority||'normal', due:!!d.follow_up_due, fuOn:d.follow_up_on||'', name:d.name, first:d.first||'', last:d.last||'', company:company, title:title,
        func:d.func||'Other', isFounder:!!d.is_founder, rank:d.rank||2, year:yr, month:month,
        era:era, eraIdx:eraIdx, url:d.url||'', email:d.email||'',
        connectedLabel: (month? self.MONTHS[month-1]+' ' : '') + (year||''),
        agoLabel: year? ((2026-year<=0)?'this year':((2026-year===1)?'1 year ago':(2026-year)+' years ago')) : 'date unknown',
        r1:self.rand(), r2:self.rand(), x:0,y:0,a:0,ton:1,big:false,rec:0,sizeMul:1
      };
      people.push(p);
      self.byKey[key]=p;
      // Seed from Trellis (baked in by the exporter); local edits already loaded win.
      if(d.flag && self.recon[key]===undefined) self.recon[key]=true;
      if(d.note && (self.notes[key]===undefined||self.notes[key]==='')) self.notes[key]=d.note;
    });
    this.people=people;
    var cc={}; people.forEach(function(p){cc[p.company]=(cc[p.company]||0)+1;}); this.companyCount=cc;
    var years=people.map(function(p){return p.year;});
    var yMin=Math.min.apply(null,years), yMax=Math.max.apply(null,years);
    var span=(yMax-yMin)||1;
    people.forEach(function(p){ p.rec=(p.year-yMin)/span; p.sizeMul=0.6+((p.rank-1)/7)*1.05; });

    // facet option sets (from real fields only)
    var fcnt={}; people.forEach(function(p){fcnt[p.func]=(fcnt[p.func]||0)+1;});
    var topCo=Object.keys(cc).sort(function(a,b){return cc[b]-cc[a];}).slice(0,13);
    var funcOrder=Object.keys(fcnt).sort(function(a,b){return fcnt[b]-fcnt[a];});
    var eqCo=function(k){return function(p){return p.company===k;};};
    var eqFn=function(k){return function(p){return p.func===k;};};
    this.facetOptions={
      company: topCo.map(function(k){return {key:k,label:k,test:eqCo(k)};}),
      role: funcOrder.map(function(k){return {key:k,label:k,test:eqFn(k)};}),
      sen: [
        {key:'founder',label:'Founders',test:function(p){return p.isFounder;}},
        {key:'exec',label:'C-level (CxO)',test:function(p){return p.rank===8&&!p.isFounder;}},
        {key:'vp',label:'VP',test:function(p){return p.rank===7;}},
        {key:'dir',label:'Director & above',test:function(p){return p.rank>=6;}},
        {key:'mgr',label:'Manager & above',test:function(p){return p.rank>=5;}},
        {key:'ic',label:'Individual contributors',test:function(p){return p.rank<=3&&!p.isFounder;}}
      ],
      era: [
        {key:'early',label:'The early days (’09–’16)',test:function(p){return p.eraIdx<=1;}},
        {key:'e3',label:'’17–’19',test:function(p){return p.era==='e3';}},
        {key:'e4',label:'’20–’22',test:function(p){return p.era==='e4';}},
        {key:'e5',label:'Recently (’23–’26)',test:function(p){return p.era==='e5';}}
      ]
    };

    var topC=topCo[0];
    var ins = DATA.insights || {};
    var notableCo = ins.notableCo || '';
    var recentN = people.filter(function(p){return p.year>=yMax-1;}).length;
    this._ins={ total:people.length, companies:Object.keys(cc).length, years:span,
      centerCo:topC, centerCoN:cc[topC],
      notableCo: notableCo, notableCoN: notableCo?(cc[notableCo]||0):0, recent:recentN,
      reconn:people.filter(function(p){return p.eraIdx<=1&&p.rank>=6;}).length,
      solo:Object.keys(cc).filter(function(k){return cc[k]===1;}).length,
      senior:people.filter(function(p){return p.rank>=6;}).length };
    var sp = DATA.stats && DATA.stats.span ? DATA.stats.span : ('’'+String(yMin).slice(2)+'–’'+String(yMax).slice(2));
    this._stats={ people:people.length, companies:Object.keys(cc).length, span:sp };

    // preset chips — built from what's actually in the network
    this.CHIPS=[{id:'reconnect', label:'Early days → now senior', facets:{era:'early',sen:'dir'}}];
    if(notableCo && (cc[notableCo]||0)>0) this.CHIPS.push({id:'notable', label:'Who’s at '+notableCo+'?', facets:{company:notableCo}});
    this.CHIPS.push({id:'founder', label:'Founders', facets:{sen:'founder'}});
    if(people.filter(function(p){return /chief operating officer/i.test(p.title);}).length>0)
      this.CHIPS.push({id:'peers', label:'My peers (COOs)', special:'peers'});
    this.CHIPS.push({id:'solo', label:'Only one I know there', special:'solo'});
  },

  // deterministic PRNG so layout is stable across reloads
  _seed:20260702,
  rand:function(){ var a=this._seed|=0; a=this._seed=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; },

  sprite:function(hex){ if(!this._sp) this._sp={}; if(this._sp[hex]) return this._sp[hex]; var s=128; var cv=document.createElement('canvas'); cv.width=s; cv.height=s; var x=cv.getContext('2d'); var A=this.hx(hex); var g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2); g.addColorStop(0,'rgba('+A[0]+','+A[1]+','+A[2]+',1)'); g.addColorStop(0.14,'rgba('+A[0]+','+A[1]+','+A[2]+',0.62)'); g.addColorStop(0.42,'rgba('+A[0]+','+A[1]+','+A[2]+',0.14)'); g.addColorStop(1,'rgba('+A[0]+','+A[1]+','+A[2]+',0)'); x.fillStyle=g; x.fillRect(0,0,s,s); this._sp[hex]=cv; return cv; },

  // ---------------- categories ----------------
  categories:function(dim){
    var self=this; var P=this.people;
    if(dim==='company'){
      var cnt=this.companyCount; var sorted=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];});
      var top=sorted.slice(0,13); var topSet={}; top.forEach(function(k){topSet[k]=1;});
      var cats=top.map(function(k,i){return {key:k,label:k,count:cnt[k],color:self.PALETTE[i%self.PALETTE.length]};});
      var otherCos=sorted.length-top.length; var otherCount=sorted.slice(13).reduce(function(s,k){return s+cnt[k];},0);
      if(otherCount>0) cats.push({key:'__other',label:'Everyone else',count:otherCount,color:this.OTHER,cos:otherCos});
      var cm={}; cats.forEach(function(c){cm[c.key]=c.color;});
      return {cats:cats, keyOf:function(p){return topSet[p.company]?p.company:'__other';}, colorOf:function(k){return cm[k];}, ordinal:false};
    }
    if(dim==='role'){
      var cnt2={}; P.forEach(function(p){cnt2[p.func]=(cnt2[p.func]||0)+1;}); var sorted2=Object.keys(cnt2).sort(function(a,b){return cnt2[b]-cnt2[a];});
      var cats2=sorted2.map(function(k,i){return {key:k,label:k,count:cnt2[k],color:self.PALETTE[i%self.PALETTE.length]};});
      var cm2={}; cats2.forEach(function(c){cm2[c.key]=c.color;});
      return {cats:cats2, keyOf:function(p){return p.func;}, colorOf:function(k){return cm2[k];}, ordinal:false};
    }
    if(dim==='seniority'){
      var labels={1:'Entry',2:'IC',3:'Senior',4:'Staff / Lead',5:'Manager',6:'Director',7:'VP',8:'Executive'};
      var cnt3={}; P.forEach(function(p){cnt3[p.rank]=(cnt3[p.rank]||0)+1;});
      var ranks=[1,2,3,4,5,6,7,8].filter(function(r){return cnt3[r];});
      var cats3=ranks.map(function(r){return {key:String(r),label:labels[r],count:cnt3[r],color:self.senColor(r)};});
      var cm3={}; cats3.forEach(function(c){cm3[c.key]=c.color;});
      return {cats:cats3, keyOf:function(p){return String(p.rank);}, colorOf:function(k){return cm3[k];}, ordinal:true};
    }
    var cnt4={}; P.forEach(function(p){cnt4[p.era]=(cnt4[p.era]||0)+1;});
    var cats4=this.ERA_KEYS.filter(function(k){return cnt4[k];}).map(function(k){return {key:k,label:self.ERA_LABELS[k],count:cnt4[k],color:self.eraColor(k)};});
    var cm4={}; cats4.forEach(function(c){cm4[c.key]=c.color;});
    return {cats:cats4, keyOf:function(p){return p.era;}, colorOf:function(k){return cm4[k];}, ordinal:true};
  },
  buildLegend:function(dim,cats){ var self=this; return cats.map(function(c){return {label:c.label + (c.cos?(' (+'+c.cos+' cos)'):''), count:self.fmt(c.count), color:c.color, glow:self.hexA(c.color,0.6)};}); },

  // ---------------- layout ----------------
  computeTargets:function(){
    var self=this; var dim=this.state.dim, layout=this.state.layout;

  computeMatch:function(){
    var self=this; var layout=this.state.layout, F=this.state.facets||{}, special=this.state.special, q=(this.state.query||'').trim().toLowerCase();
    var preds=[];
    ['company','role','sen','era'].forEach(function(dim){ if(F[dim]){ var t=self.optTest(dim,F[dim]); if(t) preds.push(t); } });
    if(special==='solo') preds.push(function(p){return self.companyCount[p.company]===1;});
    if(special==='peers') preds.push(function(p){return /chief operating officer/i.test(p.title);});
    if(q) preds.push(function(p){return p.name.toLowerCase().indexOf(q)>=0||p.company.toLowerCase().indexOf(q)>=0||p.title.toLowerCase().indexOf(q)>=0||p.func.toLowerCase().indexOf(q)>=0;});
    var has=preds.length>0; this.hasFilter=has;
    var pred = has ? function(p){return preds.every(function(fn){return fn(p);});} : null;
    this.people.forEach(function(p){ var base=(layout==='strata'&&p.key==='__other')?0:p.defA; if(pred){ var m=pred(p); p.ton=m?1:0.055; p.big=m; } else { p.ton=base; p.big=false; } });
    if(pred){
      var arr=this.people.filter(pred); this.answerText=this.describe(arr.length);
      arr.sort(function(a,b){ return (b.rank-a.rank) || (b.rec-a.rec); });
      var cap=160;
      this.matchList=arr.slice(0,cap).map(function(p){ return { id:p.id, name:p.name, sub:p.title+' · '+p.company, era:'’'+String(p.year).slice(2), dot:p.hex, glow:self.hexA(p.hex,0.6) }; });
      this.matchOverflow = arr.length>cap ? ('+ '+this.fmt(arr.length-cap)+' more not shown') : '';
      this.matchTotal=arr.length;
    } else { this.answerText=''; this.matchList=[]; this.matchOverflow=''; this.matchTotal=0; }
  },
  describe:function(n){
    var F=this.state.facets||{}, special=this.state.special, q=(this.state.query||'').trim();
    if(special==='solo') return n+(n===1?' person is':' people are')+' the only one you know at their company — hidden doors.';
    if(special==='peers') return n+' other '+(n===1?'COO shares':'COOs share')+' your title — your peer set.';
    var subj=n+(n===1?' connection':' connections');
    var cl=[];
    if(F.era) cl.push(this.ERA_PHRASE[F.era]||'');
    if(F.company) cl.push('at '+F.company);
    if(F.role) cl.push('in '+F.role);
    if(q) cl.push('matching “'+this.state.query.trim()+'”');
    var s=subj+(cl.length?' '+cl.filter(Boolean).join(' '):'');
    if(F.sen) s+=' — '+(this.SEN_CLAUSE[F.sen]||'');
    var recon = F.era==='early' && (F.sen==='dir'||F.sen==='exec'||F.sen==='vp'||F.sen==='founder');
    return s+(recon?' · prime reconnections.':'.');
  },

    h+='<div style="flex:1; background:rgba(255,255,255,0.035); border:1px solid rgba(255,255,255,0.08); border-radius:11px; padding:11px 13px;"><div style="font-family:\'IBM Plex Mono\',monospace; font-size:9.5px; color:#7f88a6; letter-spacing:0.13em;">INFERRED</div><div class="obs-wrap-any" style="font-size:14px; color:#e9ecf5; margin-top:4px;">'+esc(sel.func)+'</div><div style="font-size:11.5px; color:#8b93b0; margin-top:1px;">'+esc(this.senLabel(sel))+'</div></div></div>';
    if(reconnGold){ h+='<div style="margin-top:14px; display:flex; align-items:center; gap:9px; background:rgba(245,199,126,0.1); border:1px solid rgba(245,199,126,0.3); border-radius:11px; padding:10px 13px;"><span style="font-size:15px;">✦</span><span style="font-size:12.5px; color:#f2d29a; line-height:1.4;">Known since the early days, senior now — a natural reconnect.</span></div>'; }
    h+='<div style="margin-top:17px;"><div style="font-family:\'IBM Plex Mono\',monospace; font-size:9.5px; color:#7f88a6; letter-spacing:0.13em; margin-bottom:7px;">YOUR NOTE — HOW YOU KNOW THEM</div>';
    h+='<textarea id="obs-note" data-act="note" placeholder="Met at… · introduced by… · remember to…" style="width:100%; min-height:90px; resize:vertical; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:11px; padding:11px 13px; color:#eef1f8; font-family:inherit; font-size:13.5px; line-height:1.5;">'+esc(note)+'</textarea></div>';
    h+='<button id="obs-recon-btn" data-act="reconnect" style="'+this.reconStyle(on)+'">'+(on?'✓ Flagged to reconnect':'Flag to reconnect')+'</button>';
    h+='<div id="obs-recon-note" style="display:none; margin-top:8px; font-size:12px; color:var(--obs-due); line-height:1.45;"></div>';
    if(sel.due||sel.fuOn){ h+='<div style="margin-top:12px; font-size:12.5px; color:'+(sel.due?'var(--obs-due)':'#aab2cc')+';">'+(sel.due?'◷ Follow-up due — set for ':'◷ Follow-up set for ')+esc(sel.fuOn)+'</div>'; }
    if(sel.dbid!=null){ h+='<div style="margin-top:14px; font-size:12.5px;"><a href="workbench.html#p'+sel.dbid+'" style="color:var(--obs-accent); text-decoration:none;">Manage on the People screen →</a><span style="color:#556"> · </span><a href="warmth.html#p'+sel.dbid+'" style="color:var(--obs-accent); text-decoration:none;">Evidence on Warmth →</a></div>'; }
    h+='<div style="margin-top:17px; font-size:11px; color:rgba(150,159,190,0.55); line-height:1.55;">Straight from your export. Function &amp; seniority are inferred from the job title — nothing else was added.</div>';
    h+='</div></div>';
    el.innerHTML=h;
    this._lastPanelId=sel.id;
  },

  renderReading:function(){
    var self=this; var el=document.getElementById('r-reading');
    if(!this.state.showReading){ el.style.display='none'; el.innerHTML=''; return; }
    var ins=this._ins||{};
    // First card: a recognizable company you know a crowd at; if none, fall
    // back to how many you connected with recently.
    var card1 = (ins.notableCo && ins.notableCoN>0)
      ? { big:this.fmt(ins.notableCoN), label:'now at '+ins.notableCo, color:'#8ab4ff', act:'read-company', arg:ins.notableCo }
      : { big:this.fmt(ins.recent||0), label:'connected in the last two years', color:'#8ab4ff', act:'read-recent', arg:'' };
    var insights=[
      card1,
      { big:this.fmt(ins.reconn||0), label:'from your early days, now senior', color:'#f5c77e', act:'read-reconn', arg:'' },
      { big:this.fmt(ins.solo||0), label:'companies where you’re the only one you know', color:'#3ad39c', act:'read-solo', arg:'' },
      { big:this.fmt(ins.senior||0), label:'connections now Director-level or above', color:'#c168e0', act:'read-dir', arg:'' }
    ];
    el.style.display='';
    var h='<div data-act="closeReading" style="position:absolute; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; background:rgba(4,5,11,0.74); backdrop-filter:blur(6px); padding:24px;">';
    h+='<div data-stop="1" style="width:min(600px,92vw); max-height:92vh; overflow:auto; background:linear-gradient(180deg, rgba(18,23,44,0.97), rgba(9,12,22,0.98)); border:1px solid rgba(255,255,255,0.12); border-radius:20px; padding:26px 30px 24px; box-shadow:0 40px 120px rgba(0,0,0,0.7); animation:obsPop .4s cubic-bezier(.2,.8,.2,1) both;">';
    h+='<div style="display:flex; align-items:center; gap:9px; margin-bottom:13px;"><div style="width:8px;height:8px;border-radius:50%;background:#f5c77e;box-shadow:0 0 12px 2px rgba(245,199,126,0.8);"></div><div style="font-family:\'IBM Plex Mono\',monospace; font-size:11px; letter-spacing:0.2em; color:#aeb6d0;">A READING OF YOUR NETWORK</div></div>';
    h+='<div style="font-family:\'Instrument Serif\',serif; font-size:29px; line-height:1.1; color:#f3f5fc;">You’ve gathered '+this.fmt(ins.total||0)+' people over '+(ins.years||0)+' years.</div>';
    h+='<div style="margin-top:9px; font-size:14px; line-height:1.45; color:#b9c0d8;">Your center of gravity is '+esc(ins.centerCo||'—')+' — '+this.fmt(ins.centerCoN||0)+' connections. Here’s where else the light gathers.</div>';
    h+='<div style="margin-top:17px; display:grid; grid-template-columns:1fr 1fr; gap:10px;">';
    h+=insights.map(function(o){
      return '<button data-act="'+o.act+'" data-arg="'+esc(o.arg)+'" style="text-align:left; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); border-radius:13px; padding:13px 15px; cursor:pointer;">'
        +'<div style="font-family:\'Instrument Serif\',serif; font-size:30px; line-height:1; color:'+o.color+';">'+o.big+'</div>'
        +'<div style="margin-top:5px; font-size:12.5px; line-height:1.35; color:#c6cde3;">'+esc(o.label)+'</div>'
        +'<div style="margin-top:7px; font-family:\'IBM Plex Mono\',monospace; font-size:9.5px; letter-spacing:0.08em; color:#7f88a6;">SHOW ME →</div></button>';
    }).join('');
    h+='</div>';
    h+='<div style="margin-top:15px; text-align:center; font-family:\'IBM Plex Mono\',monospace; font-size:11px; letter-spacing:0.06em; color:#9aa3c0;">HOW TO READ THE MAP — <span style="color:#dbe1f4;">big</span> = senior · <span style="color:#dbe1f4;">bright</span> = recent · <span style="color:#dbe1f4;">near</span> = alike</div>';
    h+='<div style="margin-top:14px; display:flex; align-items:center; justify-content:space-between; gap:12px;"><div style="font-size:11px; color:rgba(150,159,190,0.6); line-height:1.5; flex:1;">Read from the fields in your export — seniority is inferred from job titles. Lines link people who share an attribute, never who-knows-whom; the real person-to-person web arrives when email &amp; calendar join this memory.</div>';
    h+='<button data-act="closeReading" style="flex:none; background:#8ab4ff; color:#0a0e18; border:none; font-weight:600; font-size:14px; font-family:inherit; padding:11px 20px; border-radius:11px; cursor:pointer;">Explore the map →</button></div>';
    h+='</div></div>';
    el.innerHTML=h;
  }
};

// ---- small helpers ----
function esc(s){ return (''+ (s==null?'':s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function setText(id,t){ var e=document.getElementById(id); if(e) e.textContent=t; }

// ---- event delegation ----
function wire(app){
  document.addEventListener('click', function(e){
    var t=e.target.closest('[data-act]'); if(!t) return;
    var act=t.getAttribute('data-act'); var arg=t.getAttribute('data-arg'); var arg2=t.getAttribute('data-arg2');
    switch(act){
      case 'openReading': app.openReading(); break;
      case 'closeReading': app.closeReading(); break;
      case 'openSync': app.openSync(); break;
      case 'closeSync': app.closeSync(); break;
      case 'copySync': app.copySync(); break;
      case 'clearFilter': app.clearFilter(); break;
      case 'setLayout': app.setLayout(arg); break;
      case 'setDim': app.setDim(arg); break;
      case 'toggleFacetMenu': app.toggleFacetMenu(arg); break;
      case 'setFacet': app.setFacet(arg,arg2); break;
      case 'clearFacetDim': app.clearFacetDim(arg); break;
      case 'chip': { var c=app.CHIPS.find(function(x){return x.id===arg;}); if(c) app.applyChip(c); break; }
      case 'focus': app.focusPerson(parseInt(arg,10)); break;
      case 'closePanel': app.closePanel(); break;
      case 'reconnect': app.toggleReconnect(); break;
      case 'read-company': app.applyReading({company:arg}); break;
      case 'read-reconn': app.applyReading({era:'early',sen:'dir'}); break;
      case 'read-solo': app.applyReadingSpecial('solo'); break;
      case 'read-dir': app.applyReading({sen:'dir'}); break;
      case 'read-recent': app.applyReading({era:'e5'}); break;
    }
  });
  // modal backdrop click closes; inner click doesn't
  document.getElementById('r-reading').addEventListener('click', function(e){
    if(e.target.closest('[data-stop]') && !e.target.closest('[data-act]')) e.stopPropagation();
  }, true);
  document.getElementById('r-sync').addEventListener('click', function(e){
    if(e.target.closest('[data-stop]') && !e.target.closest('[data-act]')) e.stopPropagation();
  }, true);
  document.addEventListener('input', function(e){
    var t=e.target; if(!t.getAttribute) return; var act=t.getAttribute('data-act');
    if(act==='search') app.onSearch(t.value);
    else if(act==='note') app.onNote(t.value);
  });
}

// ---- boot ----
function boot(){
  var app=new App();
  var css=getComputedStyle(document.documentElement);
  app.CHROME={
    accent:(css.getPropertyValue('--obs-accent')||'').trim()||'#8ab4ff',
    sky:[(css.getPropertyValue('--obs-sky-0')||'').trim()||'#121a38',
         (css.getPropertyValue('--obs-sky-1')||'').trim()||'#080c18',
         (css.getPropertyValue('--obs-sky-2')||'').trim()||'#04050b']
  };
  try{ app.notes=JSON.parse(localStorage.getItem('obs_notes')||'{}'); }catch(e){ app.notes={}; }
  try{ app.recon=JSON.parse(localStorage.getItem('obs_recon')||'{}'); }catch(e){ app.recon={}; }
  app.build();
  app.computeTargets();
  app.computeMatch();
  wire(app);
  app.render();
  app.renderReading();
  window.app=app;  // console + QA access
  app.refreshSyncBtn();
  app.initCanvas();
  window.__obs=app;
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
